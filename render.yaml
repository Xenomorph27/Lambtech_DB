# Render Blueprint for the LambTech Desk API.
#
# Render > New > Blueprint > pick this repository. Render reads this file,
# creates the service, and asks for every value marked `sync: false` - those
# are secrets or per-project values, typed into Render, never committed here.
#
# Not here: the database (Supabase project "Lambtech", ap-south-1; schema
# applied from supabase/migrations) and the screens (Vercel, built from
# frontend/ with its own vercel.json). See DEPLOY.md.
#
# Free plan: the API sleeps after 15 minutes without traffic.
# .github/workflows/keep-awake.yml pings /health every 10 minutes.
services:
  - type: web
    name: lambtech-desk-api
    runtime: python
    plan: free
    region: singapore # closest Render region to the database in Mumbai (ap-south-1)
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend/app && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # Supabase > Connect > Session pooler (port 5432). NOT the direct
      # connection: that is IPv6-only and Render cannot reach it.
      - key: DATABASE_URL
        sync: false

      # Staff login
      - key: AUTH_REQUIRED
        value: "true"
      - key: SUPABASE_URL
        value: https://yxhnejjquxiretpxxxvm.supabase.co
      - key: STAFF_EMAILS # comma separated; at least your own email
        sync: false

      # Where the screens are served from (Vercel), plus the local dev server
      # so the live API can be used while developing.
      - key: CORS_ORIGINS
        value: https://lambtechdb.vercel.app,http://localhost:5173
