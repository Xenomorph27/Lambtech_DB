# Render Blueprint for LambTech Desk: the API and the screens.
#
# Render > New > Blueprint > pick this repository. Render reads this file,
# creates both services, and asks for every value marked `sync: false` - those
# are secrets or per-project values, typed into Render, never committed here.
#
# The database is NOT here: it lives in Supabase (project "Lambtech",
# ap-south-1), and its schema is applied by Supabase's GitHub integration when
# supabase/migrations changes on main. See DEPLOY.md.
#
# Free plan: the API sleeps after 15 minutes without traffic.
# .github/workflows/keep-awake.yml pings /health every 10 minutes.
services:
  - type: web
    name: lambtech-desk-api
    runtime: python
    plan: free
    region: singapore # closest Render region to the database in Mumbai (ap-south-1)
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend/app && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # Supabase > Connect > Session pooler (port 5432). NOT the direct
      # connection: that is IPv6-only and Render cannot reach it.
      - key: DATABASE_URL
        sync: false

      # Staff login
      - key: AUTH_REQUIRED
        value: "true"
      - key: SUPABASE_URL
        value: https://yxhnejjquxiretpxxxvm.supabase.co
      - key: STAFF_EMAILS # comma separated; at least your own email
        sync: false

      # Where the screens are served from (the static site below), plus the
      # local dev server so the live API can be used while developing.
      - key: CORS_ORIGINS
        value: https://lambtech-desk.onrender.com,http://localhost:5173

  # The screens: a static site built from frontend/. Free, never sleeps.
  - type: web
    name: lambtech-desk
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    # BrowserRouter: every path must get index.html so /leads works on refresh
    # or from a shared link. Real files (/assets/*) are served before rewrites.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # All three end up in the browser's JavaScript, by design. The
      # publishable key cannot read any table (RLS is on everywhere and
      # nothing is granted to the API roles); the backend's staff check is
      # what protects the data.
      - key: VITE_API_BASE_URL
        value: https://lambtech-desk-api.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://yxhnejjquxiretpxxxvm.supabase.co
      - key: VITE_SUPABASE_ANON_KEY # Supabase > Project Settings > API > publishable key
        sync: false
